  services:
    app:
      build:
        context: ..
        dockerfile: container/Dockerfile
      ports:
        - "3000:3000"
      env_file:
        - .env
      volumes:
        - ..:/usr/src/app
        - node_modules:/usr/src/app/node_modules

      command: npm run dev
      depends_on:
        mysql:
          condition: service_healthy

    mysql:
      image: mysql:8.0
      container_name: sistema_educacional-mysql
      restart: always
      env_file:
        - mysql.env
      volumes:
        - mysql_data:/var/lib/mysql
        - ../patch/patch-geral.sql:/docker-init-files/patch-geral.sql:ro
        - ../patch/turmas.sql:/docker-init-files/turmas.sql:ro
        - ../patch/turma_vinculos.sql:/docker-init-files/turma_vinculos.sql:ro
        - ../patch/seed.sql:/docker-init-files/seed.sql:ro
        - ./init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql:ro
      ports:
        - "3306:3306"
      healthcheck:
        test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
        timeout: 5s
        interval: 10s
        retries: 5

  volumes:
    mysql_data:
    node_modules: